<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopKiro — Online Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Cart drawer transition */
    #cart-drawer { transition: transform 0.3s ease; }
    #cart-overlay { transition: opacity 0.3s ease; }
    /* Badge pop animation */
    @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
    .badge-pop { animation: pop 0.3s ease; }
    /* Product card hover */
    .product-card:hover .card-img { transform: scale(1.05); }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">

  <!-- ── NAVBAR ─────────────────────────────────────────────────── -->
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 text-brand-600 font-bold text-xl">
        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
          <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.6 8h13.2M7 13L5.4 5M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/>
        </svg>
        ShopKiro
      </a>

      <!-- Search bar -->
      <div class="hidden sm:flex flex-1 max-w-sm mx-6">
        <input id="search-input" type="text" placeholder="Search products…"
          class="w-full border border-gray-200 rounded-l-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
        <button class="bg-brand-600 hover:bg-brand-700 text-white px-4 rounded-r-lg text-sm transition">
          Search
        </button>
      </div>

      <!-- Cart button -->
      <button id="cart-btn" class="relative p-2 rounded-full hover:bg-brand-50 transition">
        <svg class="w-6 h-6 text-brand-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.6 8h13.2M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/>
        </svg>
        <span id="cart-count"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">
          0
        </span>
      </button>
    </div>

    <!-- Mobile search -->
    <div class="sm:hidden px-4 pb-3">
      <input id="search-input-mobile" type="text" placeholder="Search products…"
        class="w-full border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
    </div>
  </header>

  <!-- ── HERO ───────────────────────────────────────────────────── -->
  <section class="bg-gradient-to-r from-brand-600 to-brand-700 text-white py-14 px-4">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-3xl sm:text-5xl font-extrabold mb-3">Summer Sale — Up to 50% Off</h1>
      <p class="text-brand-100 text-lg mb-6">Free shipping on orders over $49</p>
      <a href="#products"
        class="inline-block bg-white text-brand-700 font-semibold px-8 py-3 rounded-full shadow hover:shadow-md hover:bg-brand-50 transition">
        Shop Now
      </a>
    </div>
  </section>

  <!-- ── CATEGORY FILTERS ───────────────────────────────────────── -->
  <section class="max-w-6xl mx-auto px-4 mt-10">
    <div id="filter-bar" class="flex flex-wrap gap-2">
      <!-- Injected by JS -->
    </div>
  </section>

  <!-- ── PRODUCT GRID ───────────────────────────────────────────── -->
  <main id="products" class="max-w-6xl mx-auto px-4 py-8 flex-1">
    <h2 class="text-2xl font-bold mb-6">Our Products</h2>
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5">
      <!-- Injected by JS -->
    </div>
    <p id="no-results" class="hidden text-center text-gray-400 py-16 text-lg">No products found.</p>
  </main>

  <!-- ── FOOTER ─────────────────────────────────────────────────── -->
  <footer class="bg-white border-t mt-10 py-6 text-center text-sm text-gray-400">
    © 2025 ShopKiro. All rights reserved.
  </footer>

  <!-- ── CART OVERLAY ───────────────────────────────────────────── -->
  <div id="cart-overlay"
    class="fixed inset-0 bg-black/40 z-40 opacity-0 pointer-events-none"></div>

  <!-- ── CART DRAWER ────────────────────────────────────────────── -->
  <aside id="cart-drawer"
    class="fixed top-0 right-0 h-full w-full max-w-sm bg-white z-50 shadow-2xl flex flex-col translate-x-full">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b">
      <h2 class="text-lg font-bold">Your Cart</h2>
      <button id="close-cart" class="text-gray-400 hover:text-gray-700 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Items -->
    <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-4 space-y-4">
      <p id="cart-empty" class="text-center text-gray-400 mt-16">Your cart is empty.</p>
    </div>

    <!-- Footer -->
    <div class="border-t px-5 py-4 space-y-3 bg-gray-50">
      <div class="flex justify-between font-semibold text-lg">
        <span>Total</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button id="checkout-btn"
        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition disabled:opacity-40"
        disabled>
        Checkout
      </button>
      <button id="clear-cart-btn"
        class="w-full text-sm text-red-400 hover:text-red-600 transition">
        Clear cart
      </button>
    </div>
  </aside>

  <!-- ── CHECKOUT MODAL ─────────────────────────────────────────── -->
  <div id="checkout-modal"
    class="fixed inset-0 z-60 flex items-center justify-center p-4 hidden">
    <div class="absolute inset-0 bg-black/50" id="modal-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 z-10 text-center">
      <div class="text-green-500 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h3 class="text-2xl font-bold mb-2">Order Placed!</h3>
      <p class="text-gray-500 mb-1">Thank you for your purchase.</p>
      <p id="modal-summary" class="text-brand-600 font-semibold text-lg mb-6"></p>
      <button id="modal-close"
        class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-8 py-3 rounded-xl transition">
        Continue Shopping
      </button>
    </div>
  </div>

  <!-- ── TOAST ──────────────────────────────────────────────────── -->
  <div id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-5 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  </div>

  <!-- ── JAVASCRIPT ─────────────────────────────────────────────── -->
  <script src="app.js"></script>
</body>
</html>
